name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: Install client
        run: npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client
        env:
          CI: true
